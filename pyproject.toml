[build-system]
requires = ["setuptools>=83", "wheel>=0.47"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-engine"
version = "0.3.0"
description = "Headless reference engine for the Gas Trading Model"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "openpyxl>=3.1,<4",
  "pydantic>=2.13,<3",
  "psutil>=7.2,<8",
  "tzdata>=2026.1,<2027; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
  "hypothesis>=6.165,<7",
  "mypy>=2.3,<3",
  "pytest>=9.1,<10",
  "pytest-cov>=7.1,<8",
  "ruff>=0.16,<1",
  "types-openpyxl>=3.1,<4",
  "types-psutil>=7.2,<8",
]

[project.scripts]
gtm-engine = "gtm_engine.cli:main"

[project.urls]
Repository = "https://github.com/aitorayerdi-git/gtm-engine"
Documentation = "https://github.com/aitorayerdi-git/gtm-engine/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gtm_engine = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
markers = [
  "golden: independently calculated economic regression",
  "performance: performance gate",
]

[tool.coverage.run]
branch = true
source = ["gtm_engine"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["gtm_engine"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
